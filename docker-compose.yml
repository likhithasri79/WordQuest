services:
  postgres:
    image: postgres:16-alpine
    container_name: wordquest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wordquest
    ports:
      - "5432:5432"
    volumes:
      - wordquest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wordquest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wordquest-postgres-data:
